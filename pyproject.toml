[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mla"
version = "0.1.2b0"
description = "Marketplace Listing Automation — cadastro de produtos e publicação assistida de anúncios"
requires-python = ">=3.12,<3.14"
dependencies = [
    "PySide6-Essentials==6.12.0",
    "playwright==1.63.0",
    "openpyxl==3.1.5",   # XLSX import (read-only, macros never loaded)
    "pypdf==6.1.3",      # PDF text/table extraction for import
]

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-qt==4.5.0"]
build = ["pyinstaller==6.22.3"]

[project.gui-scripts]
mla = "mla.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mla = ["resources/**/*", "persistence/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --tb=short -p no:cacheprovider"
qt_api = "pyside6"
markers = [
    "browser: testes que abrem um navegador real (Edge) via Playwright",
]
