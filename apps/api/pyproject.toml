[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mla-api"
version = "2.0.0a0"
description = "MLA Web — API (FastAPI) da plataforma de catálogo e anúncios em massa"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi==0.115.14",
    "uvicorn[standard]==0.54.0",
    "SQLAlchemy==2.0.55",
    "alembic==1.20.1",
    "psycopg[binary]==3.2.13",
    "pydantic-settings==2.16.2",
    "argon2-cffi==25.1.0",
    "email-validator>=2.2",
    "python-multipart==0.0.20",
    "openpyxl==3.1.5",   # template inspection (macros never loaded)
]

[project.optional-dependencies]
dev = ["pytest>=9", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --tb=short -p no:cacheprovider"
markers = [
    "postgres: needs a real PostgreSQL in MLA_TEST_DATABASE_URL (row-level security)",
    "perf: volume scenarios (10 / 100 / 1,000 / 5,000 products)",
]
